description = "审查当前改动的正确性、安全、负载、验证缺口、性能和冗余"
prompt = "遵守用户授权范围、明确指定的语言和格式及项目规则，默认用简明中文输出。此命令只读，不改代码、不切换模式、不持久化；未经明确要求不新增测试文件或台账。必要测试、检查、编译或构建须遵守授权和项目限制，执行前确认副作用；未经明确要求不启动前后端开发服务。默认不运行代码地图。Git/SVN 命令前确认仓库类型与根目录，切换仓库后重新确认并使用对应工具。审查用户指定的未提交或暂存改动、分支、PR 或文件；未指定时审查未提交改动，没有则审查最后一次提交。先读差异及关联调用方、下游实现、测试和 README，从部署配置等证据确定预期负载并说明假设。用有界 rg 搜索受影响引用，排除 .git、.svn、node_modules 和项目排除项。依次检查错误结果、崩溃、边界、调用契约、安全与数据损失、竞争与重复工作、内存增长、逐项查询与大输入复杂度、实质测试缺口、性能和冗余。删除建议须核实动态引用与配置，按职责判断拆分，不按行数拆函数。每项发现必须有可达的具体案例和代码证据。shortcut: 或旧 ponytail: 注释只是取舍线索，不能豁免权限、安全、数据完整性、业务契约、兼容性和实际负载问题；合理取舍不重复提。建议在根因真实所在层作最小完整修复，仅共同契约确实有误时修改共享实现；不默认改共享层，不新增不必要的抽象、框架或配置。注释应说明不明显的原因、接口约束和业务语义，shortcut 注释须注明真实限制与重新评估条件，不能替缺陷免责。测试缺口须对应具体风险，不因每个分支或修复机械要求新测试，遵守新增与执行测试边界。无风格偏好或模糊担忧。开头用“本次改动：”说明行为及负载假设。按“必须修复 / 建议修复 / 可选优化”分组编号，省略空组；每项用加粗标题和文件行号，随后列“作用 / 问题 / 修复 / 不修复的影响”，各一两句。结尾给出“结论：”、有精简发现时的“可精简：”和影响结论的“未验证：”；不能把静态检查写成运行时证明。未发现问题时说明“未发现需要修复的问题，可以交付。”及实际检查范围。"
