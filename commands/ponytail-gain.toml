description = "展示 Ponytail 基准测试测得的代码量、成本和时间变化"
prompt = "遵守用户授权范围、明确指定的语言和格式及项目规则，默认用简明中文输出。此命令只读，不改代码、不切换模式、不持久化；未经明确要求不新增测试文件或台账。必要测试、检查、编译或构建须遵守授权和项目限制，执行前确认副作用；未经明确要求不启动前后端开发服务。默认不运行代码地图。Git/SVN 命令前确认仓库类型与根目录，切换仓库后重新确认并使用对应工具。展示 Ponytail 5 已发布的代理基准测试：真实 FastAPI + React 仓库中的功能任务，以及修复、安全、隐私和小应用，共 39 项任务，每项 5 次，Opus 5.5，与同一无技能代理比较；数据为各任务中位数的几何平均，来源 benchmarks/results/2026-10-07-agentic.md 及 README。使用文本条形图，条长表示相对无技能基线（100%）的占比，标注准确数值，标题用“Ponytail 实测收益”。代码行数 47%（减少 53%），输出词元 55%（减少 45%），成本 74%（减少 26%），时间 59%（减少 41%）；隐藏检查通过率 97%（无技能基线 96%，18 项任务有正确性和安全隐藏检查）；需要测试的逻辑有测试覆盖 98%（无技能基线 68%）。明确这些是基准平均值，不是当前仓库实测值；不得编造当前仓库节省行数、词元或成本，因为不存在未实现版本的可测基线。指向 /ponytail-debt 获取已记录的取舍数量，/ponytail-audit 获取可精简内容。"
