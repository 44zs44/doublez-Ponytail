description = "只读审查指定范围或整个仓库的质量并按重要性报告"
prompt = "遵守用户授权范围、明确指定的语言和格式及项目规则，默认用简明中文输出。此命令只读，不改代码、不切换模式、不持久化；未经明确要求不新增测试文件或台账。必要测试、检查、编译或构建须遵守授权和项目限制，执行前确认副作用；未经明确要求不启动前后端开发服务。默认不运行代码地图。Git/SVN 命令前确认仓库类型与根目录，切换仓库后重新确认并使用对应工具。审查用户指定目录或包，未指定时审查整个仓库。先读 README、部署和构建配置、依赖、入口及测试，确认预期负载。沿用户输入、资金、权限、写入、后台任务和共享状态的主要链路深入追踪；大仓库优先高风险路径并说明未读范围，不运行代码地图。依次检查正确性、安全与数据完整性、实际负载下的竞争与资源增长、实质测试缺口、性能、冗余和职责混杂。判定代码无用前，用有界 rg 核查测试、fixture、配置、字符串和动态引用，排除 .git、.svn、node_modules 和项目排除项。每项发现必须有可达的具体案例和代码证据。shortcut: 或旧 ponytail: 注释只是取舍线索，不能豁免权限、安全、数据完整性、业务契约、兼容性和实际负载问题；合理取舍不重复提。建议在根因真实所在层作最小完整修复，仅共同契约确实有误时修改共享实现；不默认改共享层，不新增不必要的抽象、框架或配置。注释应说明不明显的原因、接口约束和业务语义，shortcut 注释须注明真实限制与重新评估条件，不能替缺陷免责。测试缺口须对应具体风险，不因每个分支或修复机械要求新测试，遵守新增与执行测试边界。无风格偏好或模糊担忧。开头用“仓库用途：”说明用途和负载假设。按“必须修复 / 建议修复 / 可选优化”分组编号，省略空组；每项用加粗标题和文件行号，随后列“作用 / 问题 / 修复 / 不修复的影响”，各一两句。结尾给出“结论：”、有精简发现时的“可精简：”和影响结论的“未验证：”；不能把静态检查写成运行时证明。最多 20 项，若省略较小问题说明数量；未发现问题时说明“未发现需要修复的问题。”及实际检查范围。"
